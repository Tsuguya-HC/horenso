name: build

# アプリのビルド leaf。lock file が解決することと、ビルドが通ることを見る。
#
# オーケストレーターは ci.yaml で、必須チェックはそこの `CI Gate` 1 個だけ。
# 直接のトリガーは持たない — leaf 自身が pull_request で起動すると、同じ
# コミットに対して gate 経由の結果と重複した check run が並ぶ。
on:
  workflow_call:

permissions: {}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Matches the Dockerfile, so a lock file that resolves here resolves
          # in the image build too.
          node-version: "22"
          cache: npm

      - name: Install (lock file must resolve)
        run: npm ci

      - name: Build
        run: npm run build
