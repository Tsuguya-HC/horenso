name: build

# アプリのビルド leaf。lock file が解決することと、ビルドが通ることを見る。
#
# オーケストレーターは ci.yaml で、必須チェックはそこの `CI Gate` 1 個だけ。
# 直接のトリガーは持たない — leaf 自身が pull_request で起動すると、同じ
# コミットに対して gate 経由の結果と重複した check run が並ぶ。
on:
  workflow_call:

permissions: {}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Matches the Dockerfile, so a lock file that resolves here resolves
          # in the image build too.
          node-version: "24"
          cache: npm

      - name: Install (lock file must resolve)
        run: npm ci

      - name: Build
        run: npm run build

      # 上の 2 段は runner の Node で見ているだけで、Dockerfile そのものは通らない。
      # Renovate は node イメージの digest 更新を automerge するので、ここで実際に
      # イメージを組まないと、壊れた base や runtime ステージ（npm ci --omit=dev）が
      # 誰の目にも触れずに main に入る。
      - name: Build image
        run: docker build --tag horenso:ci .

      # runtime ステージの依存だけでアプリが読み込めること（dependencies に入れ
      # 忘れた実行時依存はここで落ちる）と、非 root で動くことを見る。DB には
      # 繋がない — postgres クライアントは最初のクエリまで接続しない。
      - name: Smoke-test the image
        run: |
          set -euo pipefail
          docker run --rm horenso:ci node --input-type=module -e "await import('/app/dist/routes.js')"
          uid="$(docker run --rm horenso:ci id -u)"
          if [ "${uid}" = 0 ]; then
            echo "::error::the image runs as root"
            exit 1
          fi
